<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Location and cost gauge motif">
  <style>
    svg { color: #0e1726; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .accent { stroke: var(--brand, #0d7c66); }
    .node { fill: var(--brand, #0d7c66); stroke: none; }
    .wash { fill: color-mix(in srgb, var(--brand, #0d7c66) 10%, transparent); stroke: none; }
  </style>
  <g class="s">
    <path class="accent" d="M52 52V38h13"/>
    <path class="accent" d="M188 176v14h-13"/>
    <!-- map pin -->
    <path d="M120 44a44 44 0 0 1 44 44c0 33-44 74-44 74s-44-41-44-74a44 44 0 0 1 44-44z"/>
    <!-- gauge dial inside pin -->
    <circle class="wash" cx="120" cy="88" r="27"/>
    <circle cx="120" cy="88" r="27"/>
    <!-- dial ticks -->
    <path class="accent" d="M120 66v6M99 88h6M141 88h-6M104 72l4 4M136 72l-4 4"/>
    <!-- needle + pivot -->
    <path class="accent" d="M120 88l16-11"/>
    <circle class="node" cx="120" cy="88" r="3.4"/>
    <!-- ground baseline + tip node -->
    <path d="M78 178h84"/>
    <circle class="node" cx="120" cy="162" r="3"/>
  </g>
</svg>
