<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none" aria-hidden="true">
  <!-- Instrument-Line glyph set. Reusable: strokes use currentColor; add
       class="node"/"accent" definitions in the consuming context, or reference a
       symbol via <use href="/art/icons/appliance-glyphs.svg#g-refrigerator"/>.
       Each symbol is drawn on a 24-unit grid, fill:none, round caps/joins. -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: var(--brand, #0d7c66); stroke: none; }
      .accent { stroke: var(--brand, #0d7c66); }
    </style>
  </defs>

  <symbol id="g-refrigerator" viewBox="0 0 24 24">
    <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
    <path d="M6 10.5h12"/>
    <path d="M14.5 5.5v3M14.5 13v4"/>
    <circle class="node" cx="7.6" cy="6" r="0.9"/>
  </symbol>

  <symbol id="g-washing-machine" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
    <path d="M3.5 8h17"/>
    <circle cx="12" cy="14" r="4.6"/>
    <circle class="node" cx="17.5" cy="5.7" r="0.9"/>
  </symbol>

  <symbol id="g-dryer" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
    <path d="M3.5 8h17"/>
    <circle cx="12" cy="14" r="4.6"/>
    <path class="accent" d="M12 14v-2.6"/>
    <circle class="node" cx="6.3" cy="5.7" r="0.9"/>
  </symbol>

  <symbol id="g-dishwasher" viewBox="0 0 24 24">
    <rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/>
    <path d="M4.5 7h15"/>
    <path d="M8 11h8M8 15h8"/>
    <circle class="node" cx="8" cy="4.8" r="0.9"/>
    <circle class="node" cx="11" cy="4.8" r="0.9"/>
    <circle class="node" cx="14" cy="4.8" r="0.9"/>
  </symbol>

  <symbol id="g-range" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
    <circle cx="8.5" cy="8.5" r="2.3"/>
    <circle cx="15.5" cy="8.5" r="2.3"/>
    <path d="M6 15.5h12"/>
    <circle class="node" cx="8.5" cy="8.5" r="0.9"/>
    <circle class="node" cx="15.5" cy="8.5" r="0.9"/>
  </symbol>

  <symbol id="g-oven" viewBox="0 0 24 24">
    <rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/>
    <path d="M4.5 7h15"/>
    <rect x="7.5" y="10" width="9" height="8.5" rx="1.3"/>
    <path class="accent" d="M8.7 12.2h6.6"/>
    <circle class="node" cx="15.5" cy="4.7" r="0.9"/>
  </symbol>

  <symbol id="g-water-heater" viewBox="0 0 24 24">
    <rect x="7.5" y="3.5" width="9" height="17" rx="4"/>
    <path d="M10 3.5V1.5M14 3.5V1.5"/>
    <path d="M7.5 9h9"/>
    <circle class="node" cx="12" cy="14" r="1.1"/>
  </symbol>

  <symbol id="g-microwave" viewBox="0 0 24 24">
    <rect x="2.5" y="6.5" width="19" height="11" rx="2"/>
    <rect x="4.5" y="8.5" width="10" height="7" rx="1"/>
    <path class="accent" d="M16 8.5v7"/>
    <circle class="node" cx="18.7" cy="10" r="0.8"/>
    <circle class="node" cx="18.7" cy="13.5" r="0.8"/>
  </symbol>
</svg>
