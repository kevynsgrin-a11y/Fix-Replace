<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Dishwasher spec elevation">
  <style>
    svg { color: #0e1726; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .accent { stroke: var(--brand, #0d7c66); }
    .node { fill: var(--brand, #0d7c66); stroke: none; }
    .wash { fill: color-mix(in srgb, var(--brand, #0d7c66) 10%, transparent); stroke: none; }
    .wash-2 { fill: color-mix(in srgb, var(--brand, #0d7c66) 15%, transparent); stroke: none; }
  </style>
  <g class="s">
    <path class="accent" d="M52 40V26h13"/>
    <path class="accent" d="M188 182v14h-13"/>
    <!-- body -->
    <rect x="72" y="32" width="96" height="156" rx="13"/>
    <!-- control panel -->
    <path d="M72 52h96"/>
    <circle class="node" cx="96" cy="42" r="2.6"/>
    <circle class="node" cx="110" cy="42" r="2.6"/>
    <circle class="node" cx="124" cy="42" r="2.6"/>
    <circle class="node" cx="138" cy="42" r="2.6"/>
    <!-- pocket handle -->
    <path class="accent" d="M88 61h64"/>
    <!-- tub interior wash -->
    <rect class="wash-2" x="82" y="90" width="76" height="66" rx="6"/>
    <!-- racks + tines -->
    <path d="M86 104h68M96 104v-8M112 104v-8M128 104v-8M144 104v-8"/>
    <path d="M86 142h68M96 142v-8M112 142v-8M128 142v-8M144 142v-8"/>
    <!-- kick plate + feet -->
    <path d="M72 174h96M88 188v8M152 188v8"/>
  </g>
</svg>
