<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Dryer spec elevation">
  <style>
    svg { color: #0e1726; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .accent { stroke: var(--brand, #0d7c66); }
    .node { fill: var(--brand, #0d7c66); stroke: none; }
    .wash { fill: color-mix(in srgb, var(--brand, #0d7c66) 10%, transparent); stroke: none; }
    .glass { fill: color-mix(in srgb, #0e1726 8%, transparent); stroke: currentColor; }
  </style>
  <g class="s">
    <path class="accent" d="M46 50V36h13"/>
    <path class="accent" d="M194 174v14h-13"/>
    <!-- exhaust duct -->
    <rect x="150" y="20" width="16" height="18" rx="3"/>
    <path class="accent" d="M153 27h10M153 32h10"/>
    <circle class="node" cx="158" cy="40" r="2.6"/>
    <!-- body -->
    <rect x="66" y="42" width="108" height="140" rx="14"/>
    <!-- control panel -->
    <path d="M66 70h108"/>
    <circle cx="150" cy="56" r="5"/>
    <circle class="node" cx="130" cy="56" r="3"/>
    <!-- drum door -->
    <circle cx="120" cy="130" r="38"/>
    <circle class="glass" cx="120" cy="130" r="27"/>
    <!-- tumbler baffles -->
    <path class="accent" d="M120 106v9M105 141l7-5M135 141l-7-5"/>
    <circle class="node" cx="120" cy="130" r="3"/>
    <!-- feet -->
    <path d="M80 182v10M160 182v10"/>
  </g>
</svg>
