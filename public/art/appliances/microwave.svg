<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Microwave spec elevation">
  <style>
    svg { color: #0e1726; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .accent { stroke: var(--brand, #0d7c66); }
    .node { fill: var(--brand, #0d7c66); stroke: none; }
    .wash { fill: color-mix(in srgb, var(--brand, #0d7c66) 10%, transparent); stroke: none; }
    .glass { fill: color-mix(in srgb, #0e1726 8%, transparent); stroke: currentColor; }
  </style>
  <g class="s">
    <path class="accent" d="M34 78V64h13"/>
    <path class="accent" d="M206 156v-14h-13"/>
    <!-- width dimension -->
    <path class="accent" d="M40 54h160M40 48v12M200 48v12"/>
    <circle class="node" cx="120" cy="54" r="3"/>
    <!-- body -->
    <rect x="40" y="72" width="160" height="80" rx="12"/>
    <!-- door window -->
    <rect x="50" y="82" width="96" height="56" rx="6"/>
    <rect class="glass" x="56" y="88" width="84" height="44" rx="4"/>
    <!-- handle -->
    <path class="accent" d="M150 84v52"/>
    <!-- control panel -->
    <path d="M156 72v80"/>
    <rect class="glass" x="160" y="82" width="30" height="12" rx="3"/>
    <circle class="node" cx="164" cy="106" r="2.2"/>
    <circle class="node" cx="175" cy="106" r="2.2"/>
    <circle class="node" cx="186" cy="106" r="2.2"/>
    <circle class="node" cx="164" cy="120" r="2.2"/>
    <circle class="node" cx="175" cy="120" r="2.2"/>
    <circle class="node" cx="186" cy="120" r="2.2"/>
    <!-- vent slots -->
    <path d="M64 152v6M74 152v6M84 152v6M94 152v6"/>
  </g>
</svg>
