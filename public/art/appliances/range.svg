<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Range spec elevation">
  <style>
    svg { color: #0e1726; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .accent { stroke: var(--brand, #0d7c66); }
    .node { fill: var(--brand, #0d7c66); stroke: none; }
    .wash { fill: color-mix(in srgb, var(--brand, #0d7c66) 10%, transparent); stroke: none; }
  </style>
  <g class="s">
    <path class="accent" d="M42 48V34h13"/>
    <path class="accent" d="M198 176v14h-13"/>
    <!-- body -->
    <rect x="60" y="40" width="120" height="150" rx="13"/>
    <!-- cooktop burners (2x2) -->
    <circle cx="96" cy="72" r="12"/>
    <circle cx="144" cy="72" r="12"/>
    <circle cx="96" cy="104" r="12"/>
    <circle cx="144" cy="104" r="12"/>
    <circle class="node" cx="96" cy="72" r="2.6"/>
    <circle class="node" cx="144" cy="72" r="2.6"/>
    <circle class="node" cx="96" cy="104" r="2.6"/>
    <circle class="node" cx="144" cy="104" r="2.6"/>
    <!-- control strip + knobs -->
    <path d="M60 126h120"/>
    <circle cx="90" cy="136" r="4"/>
    <circle cx="120" cy="136" r="4"/>
    <circle cx="150" cy="136" r="4"/>
    <!-- oven door -->
    <rect x="70" y="148" width="100" height="34" rx="6"/>
    <path class="accent" d="M80 155h80"/>
    <rect class="wash" x="80" y="162" width="80" height="14" rx="4"/>
  </g>
</svg>
