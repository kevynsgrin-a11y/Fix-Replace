<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Wall oven spec elevation">
  <style>
    svg { color: #0e1726; }
    .s { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .accent { stroke: var(--brand, #0d7c66); }
    .node { fill: var(--brand, #0d7c66); stroke: none; }
    .wash { fill: color-mix(in srgb, var(--brand, #0d7c66) 10%, transparent); stroke: none; }
    .glass { fill: color-mix(in srgb, #0e1726 8%, transparent); stroke: currentColor; }
  </style>
  <g class="s">
    <path class="accent" d="M50 44V30h13"/>
    <path class="accent" d="M190 182v14h-13"/>
    <!-- built-in cabinet reveals -->
    <path class="accent" d="M68 66v16M68 156v-16M172 66v16M172 156v-16"/>
    <!-- body -->
    <rect x="74" y="34" width="92" height="152" rx="12"/>
    <!-- control panel -->
    <path d="M74 60h92"/>
    <rect class="glass" x="84" y="42" width="42" height="12" rx="3"/>
    <circle class="node" cx="142" cy="48" r="3"/>
    <circle class="node" cx="155" cy="48" r="3"/>
    <!-- oven door -->
    <rect x="82" y="68" width="76" height="110" rx="8"/>
    <path class="accent" d="M92 79h56"/>
    <rect class="wash" x="90" y="90" width="60" height="80" rx="6"/>
    <rect class="glass" x="97" y="97" width="46" height="66" rx="4"/>
  </g>
</svg>
