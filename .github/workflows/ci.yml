name: CI

# The deploy workflow only runs on push-to-main, so until now nothing checked a
# pull request. These are the same gates the front-end tooling exposes locally.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Catches broken imports, invalid route exports and prerender failures
      # that typecheck alone does not reach.
      - name: Build
        run: npm run build
