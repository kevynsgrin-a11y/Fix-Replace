<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #080c14;
        color: #f2f6fc;
        overflow: hidden;
        position: relative;
      }
      /* aurora field */
      .aurora {
        position: absolute; inset: 0;
        background:
          radial-gradient(58% 62% at 84% -6%, rgba(35,195,162,.40) 0%, transparent 62%),
          radial-gradient(46% 52% at 4% 6%, rgba(47,202,138,.26) 0%, transparent 58%),
          radial-gradient(60% 70% at 24% 116%, rgba(240,161,58,.20) 0%, transparent 62%);
      }
      /* instrument dot grid */
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(194,205,221,.20) 1px, transparent 1.4px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(78% 78% at 34% 44%, #000 24%, transparent 76%);
      }
      .frame {
        position: absolute; inset: 0;
        padding: 58px 64px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      /* ---- brand lockup ---- */
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand .mark {
        width: 56px; height: 56px; border-radius: 16px; flex: none;
        background: linear-gradient(135deg, #23c3a2 0%, #0d7c66 100%);
        display: grid; place-items: center;
        box-shadow: 0 8px 26px rgba(35,195,162,.34);
      }
      .brand .word { font-size: 30px; font-weight: 750; letter-spacing: -.022em; }
      .brand .word i { font-style: normal; color: #2fca8a; }

      /* ---- copy ---- */
      .copy { max-width: 660px; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 12px;
        font-size: 16px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
        color: #2fca8a; margin-bottom: 22px;
      }
      .eyebrow::before { content: ""; width: 26px; height: 3px; border-radius: 3px; background: #2fca8a; }
      h1 {
        font-size: var(--h1, 68px); line-height: 1.04; font-weight: 780; letter-spacing: -.035em;
        text-wrap: balance;
      }
      h1 .rep { color: #2fca8a; }
      h1 .rpl { color: #f0a13a; }
      .sub {
        margin-top: 22px; font-size: 25px; line-height: 1.42; color: #c2cddd; max-width: 34ch;
        font-weight: 420;
      }

      /* ---- footer rail ---- */
      .rail {
        display: flex; align-items: center; gap: 14px;
        font-size: 18px; font-weight: 620; color: #8b99ad; letter-spacing: -.005em;
      }
      .rail b { color: #c2cddd; font-weight: 680; }
      .rail .dot { width: 5px; height: 5px; border-radius: 50%; background: #2c3d57; flex: none; }
      .rail .pill {
        margin-left: auto; display: inline-flex; align-items: center; gap: 9px;
        padding: 9px 18px; border-radius: 999px;
        background: rgba(35,195,162,.12); border: 1px solid rgba(35,195,162,.34);
        color: #7ee0cb; font-size: 17px; font-weight: 680;
      }

      /* ---- gauge ---- */
      .gauge { position: absolute; right: 52px; top: 50%; transform: translateY(-50%); }
      .gauge.small { right: 60px; transform: translateY(-50%) scale(.86); }
      /* ---- appliance spot ---- */
      .spot { position: absolute; right: 78px; top: 50%; transform: translateY(-50%); opacity: .95; }
      /* bottom edge light */
      .edge {
        position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
        background: linear-gradient(90deg, #2fca8a 0%, #23c3a2 42%, #f0a13a 100%);
      }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <div class="grid"></div>

    <div id="art"></div>

    <div class="frame">
      <div class="brand">
        <span class="mark">
          <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
            <path d="M13 16h12l-3-3M27 24H15l3 3" stroke="#04231d" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="word">Repair<i>or</i>Replace</span>
      </div>

      <div class="copy">
        <span class="eyebrow" id="eyebrow">The math, not a guess</span>
        <h1 id="headline"></h1>
        <p class="sub" id="sub"></p>
      </div>

      <div class="rail">
        <b>Net present cost</b><span class="dot"></span>
        <b>Weibull lifespan</b><span class="dot"></span>
        <b>Local labor &amp; energy</b>
        <span class="pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Free · no sign-up
        </span>
      </div>
    </div>

    <div class="edge"></div>
  </body>
</html>
